<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星语塔罗 · 在线占卜</title>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg0:#0b0a1a; --bg1:#171434; --gold:#c9a45c; --gold2:#ecd9a8;
  --ink:#eae6f4; --muted:#9a94ba; --line:rgba(201,164,92,.35);
  --cw:110px; /* 牌扇中牌的宽度 */
}
html{scrollbar-color:var(--gold) var(--bg0)}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(1100px 500px at 75% -8%, rgba(96,72,168,.38), transparent 60%),
    radial-gradient(900px 480px at 8% 108%, rgba(56,42,110,.35), transparent 60%),
    linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg0));
  background-attachment:fixed;
}
h1,h2,.brand,.serif{font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif}
button{font-family:inherit;cursor:pointer}
::selection{background:rgba(201,164,92,.4)}

/* ============ 星空 ============ */
.star{position:fixed;border-radius:50%;background:#fff;opacity:.25;pointer-events:none;z-index:0;animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.9}}

/* ============ 页头 / 导航 ============ */
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:16px clamp(16px,4vw,48px);border-bottom:1px solid rgba(201,164,92,.18)}
.brand{font-size:22px;letter-spacing:6px;color:var(--gold2);text-shadow:0 0 18px rgba(201,164,92,.45)}
.brand b{color:var(--gold);font-weight:normal}
nav{display:flex;gap:8px}
.navbtn{background:none;border:1px solid transparent;color:var(--muted);font-size:14px;
  padding:7px 14px;border-radius:999px;letter-spacing:2px;transition:.25s}
.navbtn:hover{color:var(--gold2)}
.navbtn.on{border-color:var(--line);color:var(--gold2)}

/* ============ 视图切换 ============ */
main{position:relative;z-index:5}
.view{display:none;max-width:1060px;margin:0 auto;padding:34px clamp(16px,4vw,40px) 70px}
.view.active{display:block;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}

/* ============ 首页 ============ */
.hero{text-align:center;margin:26px 0 34px}
.hero h1{font-size:clamp(34px,6vw,54px);letter-spacing:12px;color:var(--gold2);
  text-shadow:0 0 30px rgba(201,164,92,.5);font-weight:normal}
.hero p{margin-top:14px;color:var(--muted);letter-spacing:3px;font-size:14px}
.qbox{max-width:560px;margin:0 auto 36px}
.qbox label{display:block;text-align:center;color:var(--muted);font-size:13px;letter-spacing:2px;margin-bottom:10px}
.qbox textarea{width:100%;height:74px;resize:none;border-radius:14px;padding:14px 16px;font-size:15px;
  color:var(--ink);background:rgba(23,20,52,.7);border:1px solid var(--line);outline:none;transition:.25s}
.qbox textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.15)}
.spread-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:820px;margin:0 auto 38px}
.spread-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center;
  background:rgba(23,20,52,.55);cursor:pointer;transition:.25s;user-select:none}
.spread-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.spread-card.sel{border-color:var(--gold);background:rgba(201,164,92,.12);box-shadow:0 0 24px rgba(201,164,92,.25)}
.spread-card .num{font-size:12px;color:var(--gold);letter-spacing:2px}
.spread-card h3{margin:8px 0 6px;font-size:19px;letter-spacing:4px;color:var(--gold2);font-weight:normal}
.spread-card p{font-size:12.5px;color:var(--muted);line-height:1.6}
.center{text-align:center}

/* ============ 按钮 ============ */
.btn{display:inline-block;border-radius:999px;padding:13px 38px;font-size:15px;letter-spacing:4px;
  border:1px solid var(--gold);color:var(--gold2);background:transparent;transition:.25s}
.btn:hover{box-shadow:0 0 20px rgba(201,164,92,.4);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#d8b46a,#b98f3f);color:#241a04;font-weight:bold;border:none}
.btn.ghost{border-color:rgba(154,148,186,.4);color:var(--muted);font-size:13px;padding:10px 24px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ============ 洗牌 ============ */
.deck-wrap{display:flex;flex-direction:column;align-items:center;gap:34px;padding-top:40px}
.pile{position:relative;width:140px;cursor:pointer;transition:transform .3s}
.pile:hover{transform:scale(1.04)}
.pile .layer{position:absolute;inset:0;border-radius:12px}
.pile .l1{transform:translate(7px,-7px);opacity:.35}
.pile .l2{transform:translate(3.5px,-3.5px);opacity:.65}
.pile .top{position:relative}
.pile.shuffling{animation:shake .12s linear 12}
@keyframes shake{25%{transform:translate(-9px,3px) rotate(-3deg)}50%{transform:translate(8px,-4px) rotate(2.5deg)}75%{transform:translate(-6px,-2px) rotate(-1.5deg)}}
.hint{color:var(--muted);letter-spacing:3px;font-size:14px}

/* ============ 抽牌(牌扇) ============ */
.draw-head{text-align:center;margin-bottom:8px}
.draw-head .q{color:var(--gold2);font-size:15px;letter-spacing:1px;margin-bottom:10px;opacity:.9}
.draw-head .n{color:var(--muted);letter-spacing:2px;font-size:14px}
.draw-head .n b{color:var(--gold);font-size:20px}
.fan-scroll{overflow-x:auto;overflow-y:hidden;padding:26px 0 10px}
.fan-area{position:relative;height:300px;min-width:100%}
.fan-card{position:absolute;bottom:-10px;left:50%;width:var(--cw);margin-left:calc(var(--cw)/-2);
  transform-origin:50% 300%;cursor:pointer;transition:transform .22s ease,opacity .35s;z-index:1}
.fan-card:hover{z-index:6}
.fan-card.picked{opacity:0;pointer-events:none}
.fc-inner{width:100%;aspect-ratio:120/207;border-radius:10px;overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.55),0 0 0 1px rgba(201,164,92,.5)}
.fc-inner svg{width:100%;height:100%;display:block}

/* ============ 牌阵分组与预览 ============ */
.sp-group{max-width:860px;margin:0 auto 30px}
.sp-group>h3{text-align:center;font-weight:normal;color:var(--gold);font-size:13px;letter-spacing:5px;margin-bottom:16px}
.sp-prev{position:relative;width:66px;height:46px;margin:0 auto 12px}
.sp-prev i{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);opacity:.85}

/* ============ 翻牌 ============ */
.slots{display:flex;justify-content:center;gap:clamp(14px,4vw,44px);flex-wrap:wrap;margin:36px 0 30px}
.slot{position:relative;width:160px;max-width:30vw}
.slots.grid-layout{display:grid;justify-content:center;align-items:start;gap:30px 22px;max-width:100%;overflow-x:auto}
.slots.grid-layout .slot{width:100%;max-width:none}
.chip{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:5;
  background:rgba(11,10,26,.88);border:1px solid var(--line);color:var(--gold2);
  font-size:11px;letter-spacing:1px;padding:3px 10px;border-radius:999px;pointer-events:none}
.slot.cross .chip{top:auto;bottom:-11px}
.flip{position:relative;width:100%;aspect-ratio:120/207;transform-style:preserve-3d;transform:rotate(var(--rot,0deg));
  transition:transform .85s cubic-bezier(.25,.8,.3,1.1);cursor:pointer}
.flip.flipped{transform:rotate(var(--rot,0deg)) rotateY(180deg);cursor:default}
.flip.crossing{--rot:90deg}
.side{position:absolute;inset:0;border-radius:12px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.side.back{box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 1px rgba(201,164,92,.5)}
.side.front{transform:rotateY(180deg);background:#141126;box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 1px rgba(201,164,92,.65)}
.flip.rev .fw{transform:rotate(180deg)}
#pick-dots{display:flex;justify-content:center;gap:7px;margin-top:14px;min-height:8px}
#pick-dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--gold);opacity:.45;transition:.3s}
#pick-dots i.on{background:var(--gold);opacity:1;box-shadow:0 0 8px rgba(201,164,92,.7)}
.draw-note{text-align:center;color:#6d6790;font-size:12px;letter-spacing:2px;margin-top:10px}
#go-reading{visibility:hidden;opacity:0;transition:.6s}
#go-reading.show{visibility:visible;opacity:1}

/* 牌面与占位 */
.fw{position:absolute;inset:0}
.fw img{width:100%;height:100%;object-fit:cover;display:block}
.fw .ph{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;background:linear-gradient(160deg,#221c48,#141126);border:1px solid var(--line)}
.fw .ph .glyph{font-size:26px;color:var(--gold)}
.fw .ph b{font-size:16px;letter-spacing:3px;color:var(--gold2);font-weight:normal}
.fw .ph i{font-size:10px;color:var(--muted);font-style:normal;letter-spacing:1px;text-align:center;padding:0 6px}
.fw.noimg img{display:none}
.fw.noimg .ph{display:flex}

/* ============ 解读 ============ */
.mini-row{display:flex;justify-content:center;gap:clamp(12px,3vw,30px);flex-wrap:wrap;margin-bottom:30px}
.mini-row.compact{gap:12px}
.mini-row.compact .mini{width:86px}
.mini{width:104px;text-align:center}
.mini .frame{position:relative;aspect-ratio:120/207;border-radius:10px;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 0 1px rgba(201,164,92,.55)}
.mini.rev .fw{transform:rotate(180deg)}
.mini .cap{margin-top:9px;font-size:12.5px;color:var(--gold2);letter-spacing:2px}
.mini .cap i{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:1px}
.reading-body{max-width:720px;margin:0 auto;font-size:15.5px;line-height:2;color:#d9d4ea}
.reading-body p{margin-bottom:18px}
.reading-body strong{color:var(--gold2);letter-spacing:1px}
.reading-body .kw{color:var(--muted);font-size:13px}
.reading-body .note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);
  border-radius:10px;padding:10px 14px;line-height:1.8}
.reading-body .err{color:#e89a9a;font-size:13px}
.caret{display:inline-block;width:8px;height:18px;background:var(--gold);vertical-align:-3px;
  margin-left:3px;animation:tw 1s steps(2) infinite;border-radius:2px}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:36px 0 10px}
.disclaimer{text-align:center;color:#6d6790;font-size:12px;letter-spacing:2px;margin-top:26px}

/* ============ 记录 ============ */
.rec-list{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.rec-item{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;
  padding:14px 18px;background:rgba(23,20,52,.55);cursor:pointer;transition:.25s}
.rec-item:hover{border-color:var(--gold);transform:translateX(4px)}
.rec-item .t{flex:1;min-width:0}
.rec-item .t b{display:block;font-weight:normal;color:var(--gold2);font-size:14.5px;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-item .t i{font-style:normal;font-size:12px;color:var(--muted)}
.rec-item .del{flex:none;background:none;border:none;color:var(--muted);font-size:16px;padding:6px;opacity:.6}
.rec-item .del:hover{opacity:1;color:#e89a9a}
.empty{text-align:center;color:var(--muted);letter-spacing:2px;padding:60px 0;line-height:2.2}

/* ============ 设置弹窗 ============ */
.overlay{position:fixed;inset:0;background:rgba(6,5,16,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.overlay.open{display:flex;animation:up .3s ease both}
.modal{width:100%;max-width:460px;border:1px solid var(--line);border-radius:18px;
  background:#171430;padding:28px 26px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal h2{font-weight:normal;color:var(--gold2);letter-spacing:4px;font-size:19px;margin-bottom:6px}
.modal .sub{font-size:12.5px;color:var(--muted);line-height:1.8;margin-bottom:18px}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:12.5px;color:var(--muted);letter-spacing:2px;margin-bottom:6px}
.frow input,.frow select{width:100%;border-radius:10px;padding:11px 13px;font-size:14px;color:var(--ink);
  background:rgba(11,10,26,.8);border:1px solid var(--line);outline:none}
.frow input:focus{border-color:var(--gold)}
.m-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
#test-result{font-size:12.5px;letter-spacing:1px;min-height:18px;margin-top:10px}

/* ============ 页脚 ============ */
footer{position:relative;z-index:5;text-align:center;color:#5c5780;font-size:12px;
  letter-spacing:2px;padding:18px 16px 26px;line-height:2}

/* ============ 移动端 ============ */
@media (max-width:639px){
  :root{--cw:62px}
  .spread-grid{grid-template-columns:1fr;max-width:420px}
  .brand{font-size:17px;letter-spacing:3px}
  /* 牌扇降级为横向滑动牌带 */
  .fan-area{position:static;height:auto;display:flex;align-items:center;padding:26px 14px;min-width:max-content}
  .fan-card{position:static;flex:none;margin:0 0 0 -42px;transform:none!important;transition:transform .2s,opacity .3s}
  .fan-card:first-child{margin-left:0}
  .fan-card.picked{transform:translateY(-46px)!important}
  .slot{max-width:44vw}
  .slots{gap:14px}
  .slots.grid-layout{display:flex;flex-wrap:wrap;gap:26px 14px;overflow:visible}
  .slots.grid-layout .slot{width:44vw;max-width:44vw}
}
</style>
</head>
<body>

<header>
  <div class="brand">✦ <b>星语塔罗</b></div>
  <nav>
    <button class="navbtn on" data-nav="home">占 卜</button>
    <button class="navbtn" data-nav="records">记 录</button>
    <button class="navbtn" id="nav-settings">⚙</button>
  </nav>
</header>

<main>
  <!-- 首页：提问 + 选牌阵 -->
  <section class="view active" id="view-home">
    <div class="hero">
      <h1>星 语 塔 罗</h1>
      <p>静 下 心 来 ， 让 牌 面 替 你 说 话</p>
    </div>
    <div class="qbox">
      <label>你 想 问 什 么 ？（ 可 以 跳 过 ）</label>
      <textarea id="question" maxlength="200" placeholder="例如：我近期的感情走向如何？/ 这份工作该不该接？"></textarea>
    </div>
    <div id="spread-wrap"></div>
    <div class="center"><button class="btn primary" id="start-btn">开 始 占 卜</button></div>
  </section>

  <!-- 洗牌 -->
  <section class="view" id="view-shuffle">
    <div class="deck-wrap">
      <div class="pile" id="pile">
        <div class="layer l1 fc-inner"></div>
        <div class="layer l2 fc-inner"></div>
        <div class="top fc-inner"></div>
      </div>
      <p class="hint">点 击 牌 堆 ， 洗 牌</p>
    </div>
  </section>

  <!-- 抽牌 -->
  <section class="view" id="view-draw">
    <div class="draw-head">
      <p class="q" id="draw-q"></p>
      <p class="n">凭 直 觉 选 牌 ， 还 需 选 择 <b id="remain">0</b> 张</p>
      <div id="pick-dots"></div>
      <p class="draw-note" id="draw-note"></p>
    </div>
    <div class="fan-scroll"><div class="fan-area" id="fan-area"></div></div>
  </section>

  <!-- 翻牌 -->
  <section class="view" id="view-reveal">
    <div class="center"><p class="hint">依 次 点 开 你 的 牌</p></div>
    <div class="slots" id="slots"></div>
    <div class="center"><button class="btn primary" id="go-reading">✨ 开 始 解 读</button></div>
  </section>

  <!-- 解读 -->
  <section class="view" id="view-reading">
    <div class="mini-row" id="mini-row"></div>
    <div class="reading-body" id="reading-body"></div>
    <div class="actions" id="reading-actions" style="display:none">
      <button class="btn" id="again-btn">再 来 一 占</button>
      <button class="btn ghost" id="copy-btn">复 制 解 读</button>
      <button class="btn ghost" id="regen-btn">重 新 解 读</button>
    </div>
    <div class="actions" id="history-actions" style="display:none">
      <button class="btn" id="back-records-btn">返 回 记 录</button>
      <button class="btn ghost" id="again-btn2">再 来 一 占</button>
    </div>
    <p class="disclaimer">— 塔 罗 是 一 面 镜 子 ， 答 案 始 终 在 你 心 里 —</p>
  </section>

  <!-- 记录 -->
  <section class="view" id="view-records">
    <div class="rec-list" id="rec-list"></div>
  </section>
</main>

<!-- 设置弹窗 -->
<div class="overlay" id="settings-overlay">
  <div class="modal">
    <h2>AI 解 读 设 置</h2>
    <p class="sub">使用 OpenAI 兼容接口（DeepSeek / Kimi / 通义 / OpenRouter 等均可）。
    密钥仅保存在你自己的浏览器本地，不会上传到任何服务器。不配置时使用内置简版解读。</p>
    <div class="frow">
      <label>快 速 预 设</label>
      <select id="preset">
        <option value="">— 自定义 —</option>
        <option value="deepseek">DeepSeek（国内直连推荐）</option>
        <option value="kimi">Kimi（月之暗面）</option>
        <option value="qwen">通义千问</option>
        <option value="openrouter">OpenRouter（可用 Claude 等）</option>
      </select>
    </div>
    <div class="frow"><label>API 地 址</label><input id="cfg-base" placeholder="https://api.deepseek.com"></div>
    <div class="frow"><label>API 密 钥</label><input id="cfg-key" type="password" placeholder="sk-..."></div>
    <div class="frow"><label>模 型</label><input id="cfg-model" placeholder="deepseek-chat"></div>
    <div class="m-actions">
      <button class="btn primary" id="save-cfg" style="flex:1">保 存</button>
      <button class="btn ghost" id="test-cfg">测 试 连 接</button>
    </div>
    <div id="test-result"></div>
  </div>
</div>

<footer>仅供娱乐与自我反思 · 牌面图案为公有领域 Rider-Waite-Smith 牌（1909）</footer>

<script>
'use strict';
/* ================= 数据 ================= */
const M=(id,zh,en,ku,kr,e)=>({id,zh,en,arcana:'major',ku,kr,e});
const m=(id,zh,en,suit,num,ku,kr,e)=>({id,zh,en,arcana:suit,num,ku,kr,e});

const MAJOR=[
M('m00','愚人','The Fool',['新的开始','自由','冒险','纯真'],['鲁莽','迟疑','迷失方向'],
 '愚人背着轻装走向悬崖边，象征一段未知旅程的起点。正位提醒你信任直觉、勇敢出发；逆位则警示冲动行事，或因恐惧而裹足不前。'),
M('m01','魔术师','The Magician',['创造力','行动力','资源整合','自信'],['欺骗','能力错用','准备不足'],
 '桌上四元素齐备，他是天与地的通道。正位：条件已经成熟，把想法变为现实；逆位：才能被浪费或用于操纵，需检视动机与准备。'),
M('m02','女祭司','The High Priestess',['直觉','潜意识','内在智慧','神秘'],['忽视直觉','表面化','秘密浮现'],
 '她端坐于黑白石柱之间，手持智慧卷轴。正位：答案在内心，静下来倾听直觉；逆位：与内在声音失联，或被表象蒙蔽。'),
M('m03','女皇','The Empress',['丰盛','滋养','母性','感官之美'],['依赖','创造力受阻','过度保护'],
 '大自然与丰收的女神。正位：滋养与被滋养，创造与丰饶的时期；逆位：给予失衡，或创造力需要重新疏通。'),
M('m04','皇帝','The Emperor',['秩序','结构','权威','掌控'],['专制','僵化','失控'],

function rand(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+id));

    (id==='records'&&b.dataset.nav==='records')||(id!=='records'&&b.dataset.nav==='home')));

}

let selectedSpread='three';
const GROUPS=[['quick','快 速 占 卜'],['focus','进 阶 牌 阵'],['deep','深 度 牌 阵']];
function previewHTML(s){
  const pts=s.layout?s.layout.map(l=>({x:l[0],y:l[1]})):s.positions.map((_,i)=>({x:i+1,y:1}));
  const cols=Math.max(...pts.map(p=>p.x)),rows=Math.max(...pts.map(p=>p.y));
  return `<div class="sp-prev">`+pts.map(p=>`<i style="left:${(p.x-0.5)/cols*100}%;top:${(p.y-0.5)/rows*100}%"></i>`).join('')+`</div>`;
}
function renderSpreads(){
  $('#spread-wrap').innerHTML=GROUPS.map(([g,label])=>{

    return `<div class="sp-group"><h3>${label}</h3><div class="spread-grid">${items.map(s=>`
      <div class="spread-card ${s.id===selectedSpread?'sel':''}" data-id="${s.id}">

$('#pile').addEventListener('click',()=>{
  const pile=$('#pile');
  if(pile.classList.contains('shuffling'))return;
  pile.classList.add('shuffling');
  state.deck=shuffle(CARDS).map(c=>({...c,rev:rand()<0.5}));
  setTimeout(()=>{pile.classList.remove('shuffling');enterDraw();},1500);
});

/* ================= 抽牌 ================= */
function enterDraw(){
  $('#draw-q').textContent=state.question?`「${state.question}」`:'（未提问 · 做一次通用解读）';
  $('#remain').textContent=state.spread.count;
  $('#pick-dots').innerHTML=state.spread.positions.map(()=>'<i></i>').join('');
  $('#draw-note').textContent=state.spread.count>=5?'按 抽 牌 顺 序 依 次 对 应 牌 阵 位 置':'';
  buildFan();
  show('draw');
}

function buildFan(){
  const area=$('#fan-area');area.innerHTML='';
  const n=CARDS.length, mobile=isMobile();
  const step=mobile?0:1.6;
  CARDS.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='fan-card';
    const a=(i-(n-1)/2)*step;
    if(!mobile)el.style.transform=`rotate(${a}deg)`;
    el.innerHTML=`<div class="fc-inner">${BACK_SVG}</div>`;
    if(!mobile){
      el.addEventListener('mouseenter',()=>{if(!el.classList.contains('picked'))el.style.transform=`rotate(${a}deg) translateY(-4%)`});
      el.addEventListener('mouseleave',()=>{if(!el.classList.contains('picked'))el.style.transform=`rotate(${a}deg)`});
    }
    el.addEventListener('click',()=>{
      if(el.classList.contains('picked')||state.picks.length>=state.spread.count)return;
      const card=state.deck[state.picks.length];
      state.picks.push(card);
      el.classList.add('picked');
      if(!mobile)el.style.transform=`rotate(${a}deg) translateY(-70%) scale(1.06)`;
      $('#remain').textContent=state.spread.count-state.picks.length;
      const dots=document.querySelectorAll('#pick-dots i');
      if(dots[state.picks.length-1])dots[state.picks.length-1].classList.add('on');
      if(state.picks.length>=state.spread.count)setTimeout(enterReveal,750);
    });
    area.appendChild(el);
  });
}

/* ================= 翻牌 ================= */
function faceHTML(card){
  return `<div class="fw">
    <img src="images/${card.id}.jpg" alt="${card.zh}" draggable="false" onerror="this.closest('.fw').classList.add('noimg')">
    <div class="ph"><span class="glyph">${SUIT_META[card.arcana].glyph}</span><b>${card.zh}</b><i>${card.en}</i></div>
  </div>`;
}

function enterReveal(){
  const box=$('#slots');box.innerHTML='';
  const L=state.spread.layout;
  box.classList.toggle('grid-layout',!!L);
  if(L){
    const cols=Math.max(...L.map(l=>l[0]));
    box.style.gridTemplateColumns=`repeat(${cols}, minmax(0, 132px))`;
  }else box.style.gridTemplateColumns='';
  $('#go-reading').classList.remove('show');
  let flipped=0;
  state.picks.forEach((card,i)=>{
    const pos=state.spread.positions[i];
    const slot=document.createElement('div');
    slot.className='slot'+(pos.cross?' cross':'');
    if(L){slot.style.gridColumn=String(L[i][0]);slot.style.gridRow=String(L[i][1]);}
    slot.innerHTML=`
      <div class="flip ${card.rev?'rev':''} ${pos.cross?'crossing':''}">
        <div class="side back">${BACK_SVG}</div>
        <div class="side front">${faceHTML(card)}</div>
      </div>
      <div class="chip">${i+1} · ${pos.name}</div>`;
    const flip=slot.querySelector('.flip');
    flip.addEventListener('click',function(){
      if(this.classList.contains('flipped'))return;
      this.classList.add('flipped');
      if(pos.cross)slot.style.pointerEvents='none';
      if(++flipped===state.picks.length){createRecord();$('#go-reading').classList.add('show');}
    });
    box.appendChild(slot);
  });
  show('reveal');
}

$('#go-reading').addEventListener('click',()=>{enterReading('live');startReading();});

/* ================= 记录 ================= */
function createRecord(){
  const id=Date.now().toString(36)+Math.floor(rand()*1e4).toString(36);
  const recs=store.records;
  recs.unshift({id,ts:Date.now(),q:state.question,spread:state.spread.id,
    picks:state.picks.map(p=>({cid:p.id,rev:p.rev})),reading:''});
  store.records=recs;state.recordId=id;
}
function updateRecordReading(text){
  if(!state.recordId)return;
  const recs=store.records;const r=recs.find(r=>r.id===state.recordId);
  if(r){r.reading=text;store.records=recs;}
}
function renderRecords(){
  const recs=store.records;
  if(!recs.length){
    $('#rec-list').innerHTML=`<div class="empty">还 没 有 占 卜 记 录<br>去 抽 第 一 张 牌 吧 ✦</div>`;
    return;
  }
  $('#rec-list').innerHTML=recs.map(r=>{
    const s=SPREADS.find(x=>x.id===r.spread);
    const d=new Date(r.ts);
    const when=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const cards=r.picks.map(p=>CARD_BY_ID[p.cid]?.zh).filter(Boolean).join(' · ');
    return `<div class="rec-item" data-id="${r.id}">
      <div class="t"><b>${r.q||'（未提问）'}</b><i>${when} ｜ ${s?.name||''} ｜ ${cards}</i></div>
      <button class="del" data-del="${r.id}" title="删除">✕</button>
    </div>`;
  }).join('');
  document.querySelectorAll('.rec-item').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.dataset.del)return;
    openHistory(el.dataset.id);
  }));
  document.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();
    store.records=store.records.filter(r=>r.id!==btn.dataset.del);
    renderRecords();
  }));
}

function openHistory(id){
  const r=store.records.find(x=>x.id===id);
  if(!r)return;
  state.mode='history';
  state.spread=SPREADS.find(s=>s.id===r.spread);
  state.question=r.q;state.picks=r.picks.map(p=>({...CARD_BY_ID[p.cid],rev:p.rev}));
  state.recordId=id;state.lastRaw=r.reading;
  enterReading('history');
  $('#reading-body').innerHTML=r.reading?mdLite(r.reading):'<p class="note">这次占卜的解读没有保存下来。</p>';
  $('#reading-actions').style.display='none';
  $('#history-actions').style.display='flex';
}

function sysPrompt(count){
  const per=count<=3?'80-120字':count<=5?'60-90字':'40-60字';
  const sum=count<=3?'100字以内':'160字以内';
  return '你是一位资深的塔罗解读师，为一款娱乐性质的塔罗应用工作（免责声明已由产品界面统一展示，解读中不要再重复）。解读要求：'
   +'1. 大胆而明确：塔罗的魅力在于给出清晰的"牌面答案"。直接回应求问者的问题，用"牌面显示""这张牌暗示"的口吻，给出具体、有倾向性的判断（包括是否、倾向、时间感；二选一时给出明确推荐），不要含糊其辞，不要拒绝解读，不要说"塔罗无法预测"，不要让求问者去咨询医生或其他专业人士；'
   +'2. 紧扣每张牌的牌义、位置含义与正逆位，把牌意编织进求问者的真实处境，像一位了解TA的朋友在说话，不要泛泛的套话；'
   +'3. 语气温和有力量，不制造恐惧；即使出现凶牌，也指出其中蕴含的转机与行动建议；'
   +'4. 全程中文，不要使用markdown标题语法。'
   +'输出格式：先以1-2句话回应问题、点出整体牌面能量；然后逐张解读，每张单独成段，第一行为小标题「位置名｜牌名（正/逆位）」——位置名必须原样使用我给出的位置名称（例如：过去、现在、未来），每段'+per+'；最后以「综合指引」收尾（'+sum+'），在其中明确回答求问者最初的问题。';
}

function buildPrompt(){
  const s=state.spread;
  const lines=[`【求问者的问题】${state.question||'（未提供具体问题，请做一次通用解读）'}`,
    `【牌阵】${s.name}（${s.desc}）`,'【抽到的牌】'];
  state.picks.forEach((p,i)=>{
    const pos=s.positions[i];
    lines.push(`「${pos.name}」（位置含义：${pos.meaning}）：${p.zh} ${p.en}（${p.rev?'逆位':'正位'}）。关键词：${(p.rev?p.kr:p.ku).join('、')}。核心牌义：${p.e}`);
  });
  lines.push(`【位置名称】依次为：${s.positions.map(p=>p.name).join('、')}。解读的小标题必须原样使用这些位置名称。`);
  if(s.verdict)lines.push('【特别要求】'+s.verdict);
  return lines.join('\n');
}

function mdLite(t){
  const esc=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.split(/\n{2,}/).map(p=>`<p>${p.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</p>`).join('');
}

function localVerdict(){
  const s=state.spread;
  const tail='牌面已经为你呈现了此刻的能量图景，带着这份提示，从容地做出自己的选择吧。';
  if(s.verdictType==='yesno'){
    const yes=state.picks.filter(p=>!p.rev).length;
    const v=yes>=2?'是':yes===1?'悬而未决':'否';
    return `三张牌中正位 ${yes} 张、逆位 ${3-yes} 张，牌面倾向于「${v}」。`+tail;
  }
  if(s.verdictType==='season'){
    const score=p=>(p.arcana==='major'?2:0)+((p.num||0)>=11?1:0)+(p.rev?0:1);
    let bi=0;state.picks.forEach((p,i)=>{if(score(p)>score(state.picks[bi]))bi=i;});
    return `能量最强的是「${s.positions[bi].name}」位（${state.picks[bi].zh}），事情最可能应验在${s.positions[bi].name}季。`+tail;
  }
  return '牌面已经为你呈现了此刻的能量图景。塔罗不是预言，而是一面镜子——它照见你内心其实已经知道的答案。带着这份提示，从容地做出自己的选择吧。';
}
function localReadingHTML(){
  const s=state.spread;
  const parts=[`<p class="note">⚙ 内置简版解读 · 点击右上角 ⚙ 配置 AI（支持 DeepSeek 等），即可获得结合你问题的个性化深度解读</p>`];
  state.picks.forEach((p,i)=>{
    const pos=s.positions[i];
    parts.push(`<p><strong>${pos.name}｜${p.zh}（${p.rev?'逆位':'正位'}）</strong><br>${pos.meaning}。${p.e}<br><span class="kw">关键词：${(p.rev?p.kr:p.ku).join(' · ')}</span></p>`);
  });
  parts.push(`<p><strong>综合指引</strong><br>${localVerdict()}</p>`);
  return parts.join('');
}
function localReadingText(){
  const s=state.spread;
  const parts=['【内置简版解读】'];
  state.picks.forEach((p,i)=>{
    const pos=s.positions[i];
    parts.push(`${pos.name}｜${p.zh}（${p.rev?'逆位':'正位'}）\n${pos.meaning}。${p.e}\n关键词：${(p.rev?p.kr:p.ku).join('、')}`);
  });
  parts.push('综合指引\n'+localVerdict());
  return parts.join('\n\n');
}

async function startReading(){
  const cfg=store.settings;
  const body=$('#reading-body');
  state.lastRaw='';
  if(!cfg.key||!cfg.base||!cfg.model){
    body.innerHTML=localReadingHTML();
    updateRecordReading(localReadingText());
    $('#reading-actions').style.display='flex';
    $('#regen-btn').style.display='none';
    return;
  }
  $('#regen-btn').style.display='';
  body.innerHTML='<span class="caret"></span>';
  let raw='';
  try{
    const resp=await fetch(cfg.base.replace(/\/+$/,'')+'/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify({model:cfg.model,stream:true,temperature:0.8,max_tokens:Math.min(1500+state.spread.count*180,3400),
        messages:[{role:'system',content:sysPrompt(state.spread.count)},{role:'user',content:buildPrompt()}]}),
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status+' '+(await resp.text()).slice(0,200));
    const reader=resp.body.getReader(),dec=new TextDecoder();
    let buf='';
    for(;;){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        const t=line.trim();
        if(!t.startsWith('data:'))continue;
        const d=t.slice(5).trim();
        if(d==='[DONE]')break;
        try{
          const j=JSON.parse(d);
          const c=j.choices?.[0]?.delta?.content;
          if(c){raw+=c;body.innerHTML=mdLite(raw)+'<span class="caret"></span>';}
        }catch{}
      }
    }
    if(!raw)throw new Error('接口没有返回内容');
    state.lastRaw=raw;
    body.innerHTML=mdLite(raw);
    updateRecordReading(raw);
  }catch(err){
    body.innerHTML=`<p class="err">✕ AI 解读失败：${String(err.message||err)}<br>可能是网络不通、密钥有误，或该服务商不允许浏览器直接调用。下面先为你展示内置简版解读：</p>`+localReadingHTML();
    updateRecordReading(localReadingText());
  }
  $('#reading-actions').style.display='flex';
}

/* ================= 解读页按钮 ================= */
function resetFlow(){
  state.question='';state.picks=[];state.recordId=null;state.mode='live';state.lastRaw='';
  $('#question').value='';
  show('home');
}
$('#again-btn').addEventListener('click',resetFlow);
$('#again-btn2').addEventListener('click',resetFlow);
$('#regen-btn').addEventListener('click',()=>{startReading();});
$('#back-records-btn').addEventListener('click',()=>{renderRecords();show('records');});
$('#copy-btn').addEventListener('click',async()=>{
  try{
    await navigator.clipboard.writeText($('#reading-body').innerText);
    $('#copy-btn').textContent='已 复 制 ✓';
    setTimeout(()=>$('#copy-btn').textContent='复 制 解 读',1600);
  }catch{alert('复制失败，请手动选择文本复制');}
});

/* ================= 导航 ================= */
document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>{
  if(btn.dataset.nav==='records'){renderRecords();show('records');}
  else resetFlow();
}));

/* ================= 设置 ================= */
const PRESETS={
  deepseek:{base:'https://api.deepseek.com',model:'deepseek-chat'},
  kimi:{base:'https://api.moonshot.cn',model:'moonshot-v1-8k'},
  qwen:{base:'https://dashscope.aliyuncs.com/compatible-mode',model:'qwen-plus'},
  openrouter:{base:'https://openrouter.ai/api',model:''},
};
$('#nav-settings').addEventListener('click',()=>{
  const cfg=store.settings;
  $('#cfg-base').value=cfg.base||'';$('#cfg-key').value=cfg.key||'';$('#cfg-model').value=cfg.model||'';
  $('#test-result').textContent='';
  $('#settings-overlay').classList.add('open');
});
$('#settings-overlay').addEventListener('click',e=>{
  if(e.target.id==='settings-overlay')$('#settings-overlay').classList.remove('open');
});
$('#preset').addEventListener('change',()=>{
  const p=PRESETS[$('#preset').value];
  if(p){$('#cfg-base').value=p.base;$('#cfg-model').value=p.model;}
});
$('#save-cfg').addEventListener('click',()=>{
  store.settings={base:$('#cfg-base').value.trim(),key:$('#cfg-key').value.trim(),model:$('#cfg-model').value.trim()};
  $('#settings-overlay').classList.remove('open');
});
$('#test-cfg').addEventListener('click',async()=>{
  const base=$('#cfg-base').value.trim().replace(/\/+$/,''),key=$('#cfg-key').value.trim(),model=$('#cfg-model').value.trim();
  const out=$('#test-result');
  if(!base||!key||!model){out.textContent='请先把三项都填上';return;}
  out.textContent='测试中…';
  try{
    const r=await fetch(base+'/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,max_tokens:8,messages:[{role:'user',content:'hi'}]})});
    if(r.ok){out.textContent='✓ 连接成功，可以保存了';}
    else{out.textContent='✗ HTTP '+r.status+'：'+(await r.text()).slice(0,120);}
  }catch(e){out.textContent='✗ 连接失败：'+String(e.message||e)+'（该服务商可能不允许浏览器直接调用）';}
});

/* ================= 星空背景 ================= */
function initStars(){
  for(let i=0;i<90;i++){
    const s=document.createElement('div');
    s.className='star';
    const size=1+Math.random()*1.8;
    s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}vw;top:${Math.random()*100}vh;animation-delay:${Math.random()*4}s;animation-duration:${2.5+Math.random()*4}s`;
    document.body.appendChild(s);
  }
}

/* ================= 启动 ================= */
document.querySelectorAll('#pile .fc-inner').forEach(el=>el.innerHTML=BACK_SVG);
renderSpreads();
initStars();
